<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. alee de acces (18 × 1,5 m)</text>
<text x="64" y="724.0">2. strat înălțat 1 (3 × 1,2 m)</text>
<text x="64" y="740.0">3. strat înălțat 2 (3 × 1,2 m)</text>
<text x="64" y="756.0">4. strat înălțat 3 (3 × 1,2 m)</text>
<text x="64" y="772.0">5. strat înălțat 4 (3 × 1,2 m)</text>
<text x="64" y="788.0">6. strat înălțat 5 (3 × 1,2 m)</text>
<text x="64" y="804.0">7. strat înălțat 6 (3 × 1,2 m)</text>
<text x="64" y="820.0">8. strat înălțat 7 (3 × 1,2 m)</text>
<text x="64" y="836.0">9. strat înălțat 8 (3 × 1,2 m)</text>
<text x="64" y="852.0">10. strat înălțat 9 (3 × 1,2 m)</text>
<text x="64" y="868.0">11. strat înălțat 10 (3 × 1,2 m)</text>
<text x="64" y="884.0">12. magazie de unelte (2,5 × 2 m)</text>
<text x="64" y="900.0">13. zonă de compost (2 × 1,5 m)</text>
<text x="64" y="916.0">14. rezervor de apă și punct de udare (1 × 1 m)</text>
<text x="64" y="932.0">15. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="948.0">16. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="964.0">17. bancă 3 (1,8 × 0,6 m)</text>
<text x="64" y="980.0">18. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="996.0">19. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="1012.0">20. panou cu regulamentul de folosire (0,8 × 0,1 m)</text>
<text x="64" y="1044.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 20 × 30 m cu aceeași</text>
<text x="64" y="1060.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="1076.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="1092.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="1108.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="1124.0" font-size="11" fill="#555">Intrarea e pe latura de jos, cu o alee de 1,5 m.</text>
<text x="64" y="1140.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="1156.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
