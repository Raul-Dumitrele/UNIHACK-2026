<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. alee de acces (10 × 1,5 m)</text>
<text x="64" y="724.0">2. structură de joacă cu tobogan (6 × 4 m)</text>
<text x="64" y="740.0">3. leagăne (4 × 2,5 m)</text>
<text x="64" y="756.0">4. nisipar (3 × 3 m)</text>
<text x="64" y="772.0">5. balansoar (3 × 0,6 m)</text>
<text x="64" y="788.0">6. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="804.0">7. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="820.0">8. bancă 3 (1,8 × 0,6 m)</text>
