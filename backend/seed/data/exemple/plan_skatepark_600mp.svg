<rect x="82.67" y="161.87" width="16.80" height="16.80" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e4" x="88.27" y="167.47" width="5.60" height="5.60" fill="#cccccc" stroke="#333" stroke-width="1"><title>stâlp de iluminat LED 2</title></rect>
<rect x="82.67" y="132.0" width="52.27" height="29.87" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e5" x="92.0" y="141.33" width="33.60" height="11.20" fill="#8d7b68" stroke="#333" stroke-width="1"><title>bancă 1</title></rect>
<rect x="134.93" y="132.0" width="52.27" height="29.87" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e6" x="144.27" y="141.33" width="33.60" height="11.20" fill="#8d7b68" stroke="#333" stroke-width="1"><title>bancă 2</title></rect>
<rect x="187.2" y="132.0" width="52.27" height="29.87" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e7" x="196.53" y="141.33" width="33.60" height="11.20" fill="#8d7b68" stroke="#333" stroke-width="1"><title>bancă 3</title></rect>
<rect x="239.47" y="139.47" width="22.40" height="22.40" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e8" x="245.07" y="145.07" width="11.20" height="11.20" fill="#555555" stroke="#333" stroke-width="1"><title>coș de gunoi 1</title></rect>
<rect x="261.87" y="139.47" width="22.40" height="22.40" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e9" x="267.47" y="145.07" width="11.20" height="11.20" fill="#555555" stroke="#333" stroke-width="1"><title>coș de gunoi 2</title></rect>
<rect x="99.47" y="165.6" width="26.13" height="13.07" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e10" x="105.07" y="171.2" width="14.93" height="1.87" fill="#cccccc" stroke="#333" stroke-width="1"><title>panou cu regulamentul de folosire</title></rect>
</g>
<g id="TEXT">
<text x="250.67" y="607.33" text-anchor="middle" font-size="11">1</text>
<text x="241.33" y="388.00" text-anchor="middle" font-size="11">2</text>
<text x="408.4" y="575.13" text-anchor="middle" font-size="8">3</text>
<text x="91.07" y="164.47" text-anchor="middle" font-size="8">4</text>
<text x="161.07" y="138.33" text-anchor="middle" font-size="8">5–7</text>
<text x="261.87" y="142.07" text-anchor="middle" font-size="8">8–9</text>
<text x="112.53" y="168.20" text-anchor="middle" font-size="8">10</text>
</g>
<g id="COTE" stroke="#000" stroke-width="1">
<line x1="64.0" y1="658.0" x2="437.33" y2="658.0"/>
<line x1="64.0" y1="653.0" x2="64.0" y2="663.0"/>
<line x1="437.33" y1="653.0" x2="437.33" y2="663.0"/>
<line x1="38" y1="636.0" x2="38" y2="76.0"/>
<line x1="33" y1="636.0" x2="43" y2="636.0"/>
<line x1="33" y1="76.0" x2="43" y2="76.0"/>
</g>
<text x="250.67" y="676.0" text-anchor="middle">20 m</text>
<text x="30" y="356.0" text-anchor="middle" transform="rotate(-90 30 356.0)">30 m</text>
<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. alee de acces (18 × 1,5 m)</text>
<text x="64" y="724.0">2. zonă de skate (rampe și obstacole) (15 × 20 m)</text>
<text x="64" y="740.0">3. stâlp de iluminat LED 1 (0,3 × 0,3 m)</text>
<text x="64" y="756.0">4. stâlp de iluminat LED 2 (0,3 × 0,3 m)</text>
<text x="64" y="772.0">5. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="788.0">6. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="804.0">7. bancă 3 (1,8 × 0,6 m)</text>
<text x="64" y="820.0">8. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="836.0">9. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="852.0">10. panou cu regulamentul de folosire (0,8 × 0,1 m)</text>
<text x="64" y="868.0">Nu încape: zonă pentru începători – nu mai încape pe teren (are nevoie de cel puțin 6 × 7 m, cu zona</text>
<text x="64" y="884.0">    liberă din jur)</text>
<text x="64" y="916.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 20 × 30 m cu aceeași</text>
<text x="64" y="932.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="948.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="964.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="980.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="996.0" font-size="11" fill="#555">Intrarea e pe latura de jos, cu o alee de 1,5 m.</text>
<text x="64" y="1012.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="1028.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
