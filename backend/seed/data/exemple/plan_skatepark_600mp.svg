<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Plan schematic: skatepark, 600 mp</title>
<rect width="720" height="1060" fill="#ffffff"/>
<text x="64" y="28" font-size="18" font-weight="bold">Plan schematic: skatepark, 600 mp</text>
<text x="64" y="48" fill="#555">skatepark · teren de 600 mp (20 × 30 m) · plan schematic</text>
<g id="TEREN">
<rect x="64.0" y="76.0" width="373.33" height="560.00" fill="#eef4e8" stroke="#2f4f2f" stroke-width="2"/>
</g>
<g id="ELEMENTE">
<rect id="e1" x="82.67" y="589.33" width="336.00" height="28.00" fill="#d9d4c7" stroke="#333" stroke-width="1"><title>alee de acces</title></rect>
<rect x="82.67" y="178.67" width="317.33" height="410.67" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e2" x="101.33" y="197.33" width="280.00" height="373.33" fill="#9fb7d6" stroke="#333" stroke-width="1"><title>zonă de skate (rampe și obstacole)</title></rect>
<rect x="400.0" y="572.53" width="16.80" height="16.80" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
