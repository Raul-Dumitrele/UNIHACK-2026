<svg xmlns="http://www.w3.org/2000/svg" width="720" height="916" viewBox="0 0 720 916" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Plan schematic: fântână publică de băut apă (cișmea), 600 mp</title>
<rect width="720" height="916" fill="#ffffff"/>
<text x="64" y="28" font-size="18" font-weight="bold">Plan schematic: fântână publică de băut apă (cișmea), 600 mp</text>
<text x="64" y="48" fill="#555">fântână publică de băut apă (cișmea) · teren de 600 mp (20 × 30 m) · plan schematic</text>
<g id="TEREN">
<rect x="64.0" y="76.0" width="373.33" height="560.00" fill="#eef4e8" stroke="#2f4f2f" stroke-width="2"/>
</g>
<g id="ELEMENTE">
<rect x="82.67" y="578.13" width="39.20" height="39.20" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e1" x="97.6" y="593.07" width="9.33" height="9.33" fill="#8cc8e8" stroke="#333" stroke-width="1"><title>cișmea publică din metal, cu buton temporizat</title></rect>
<rect x="121.87" y="598.67" width="18.67" height="18.67" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e2" x="125.6" y="602.4" width="11.20" height="11.20" fill="#8cc8e8" stroke="#333" stroke-width="1"><title>cămin de vane cu robinet de golire pentru iarnă</title></rect>
<rect x="140.53" y="594.93" width="22.40" height="22.40" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e3" x="146.13" y="600.53" width="11.20" height="11.20" fill="#555555" stroke="#333" stroke-width="1"><title>coș de gunoi 1</title></rect>
<rect x="162.93" y="594.93" width="22.40" height="22.40" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect id="e4" x="168.53" y="600.53" width="11.20" height="11.20" fill="#555555" stroke="#333" stroke-width="1"><title>coș de gunoi 2</title></rect>
</g>
<g id="TEXT">
<text x="102.27" y="590.07" text-anchor="middle" font-size="8">1</text>
<text x="131.2" y="599.40" text-anchor="middle" font-size="8">2</text>
<text x="162.93" y="597.53" text-anchor="middle" font-size="8">3–4</text>
</g>
<g id="COTE" stroke="#000" stroke-width="1">
<line x1="64.0" y1="658.0" x2="437.33" y2="658.0"/>
<line x1="64.0" y1="653.0" x2="64.0" y2="663.0"/>
<line x1="437.33" y1="653.0" x2="437.33" y2="663.0"/>
<line x1="38" y1="636.0" x2="38" y2="76.0"/>
<line x1="33" y1="636.0" x2="43" y2="636.0"/>
<line x1="33" y1="76.0" x2="43" y2="76.0"/>
</g>
<text x="250.67" y="676.0" text-anchor="middle">20 m</text>
<text x="30" y="356.0" text-anchor="middle" transform="rotate(-90 30 356.0)">30 m</text>
<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. cișmea publică din metal, cu buton temporizat (0,5 × 0,5 m)</text>
<text x="64" y="724.0">2. cămin de vane cu robinet de golire pentru iarnă (0,6 × 0,6 m)</text>
<text x="64" y="740.0">3. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="756.0">4. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="788.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 20 × 30 m cu aceeași</text>
<text x="64" y="804.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="820.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="836.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="852.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="868.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="884.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
