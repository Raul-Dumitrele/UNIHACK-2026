<text x="64" y="868.0">11. strat înălțat 10 (3 × 1,2 m)</text>
<text x="64" y="884.0">12. magazie de unelte (2,5 × 2 m)</text>
<text x="64" y="900.0">13. zonă de compost (2 × 1,5 m)</text>
<text x="64" y="916.0">14. rezervor de apă (1 × 1 m)</text>
<text x="64" y="932.0">15. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="948.0">16. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="964.0">17. bancă 3 (1,8 × 0,6 m)</text>
<text x="64" y="980.0">18. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="996.0">19. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="1028.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 27,6 × 41,3 m cu aceeași</text>
<text x="64" y="1044.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="1060.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="1076.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="1092.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="1108.0" font-size="11" fill="#555">Intrarea e pe latura de jos, cu o alee de 1,5 m.</text>
<text x="64" y="1124.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="1140.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
