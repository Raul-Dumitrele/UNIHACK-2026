<text x="250.33" y="676.0" text-anchor="middle">37,4 m</text>
<text x="30" y="356.0" text-anchor="middle" transform="rotate(-90 30 356.0)">56,2 m</text>
<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. alee de acces (35,4 × 1,5 m)</text>
<text x="64" y="724.0">2. zonă de skate (rampe și obstacole) (20 × 15 m)</text>
<text x="64" y="740.0">3. zonă pentru începători (8 × 6 m)</text>
<text x="64" y="756.0">4. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="772.0">5. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="788.0">6. bancă 3 (1,8 × 0,6 m)</text>
<text x="64" y="804.0">7. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="820.0">8. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="852.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 37,4 × 56,2 m cu aceeași</text>
<text x="64" y="868.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="884.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="900.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="916.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="932.0" font-size="11" fill="#555">Intrarea e pe latura de jos, cu o alee de 1,5 m.</text>
<text x="64" y="948.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="964.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
