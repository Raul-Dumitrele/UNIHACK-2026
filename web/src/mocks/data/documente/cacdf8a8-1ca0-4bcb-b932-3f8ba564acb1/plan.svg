<rect id="e9" x="317.87" y="550.13" width="33.60" height="11.20" fill="#8d7b68" stroke="#333" stroke-width="1"><title>bancă 3</title></rect>
<rect x="297.33" y="510.93" width="22.40" height="22.40" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3"/>
