<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1044" viewBox="0 0 720 1044" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Amenajare: pistă de biciclete – Teren liber de lângă blocuri (exemplu)</title>
<rect width="720" height="1044" fill="#ffffff"/>
<text x="64" y="28" font-size="18" font-weight="bold">Amenajare: pistă de biciclete – Teren liber de lângă blocuri (exemplu)</text>
<text x="64" y="48" fill="#555">pistă de biciclete · teren de 600 mp (20 × 30 m) · plan schematic</text>
<g id="TEREN">
