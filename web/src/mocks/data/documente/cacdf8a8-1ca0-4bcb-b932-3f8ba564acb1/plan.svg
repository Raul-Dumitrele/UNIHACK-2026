<text x="250.67" y="122.00" text-anchor="middle" font-size="11">2</text>
<text x="106.00" y="360.00" text-anchor="middle" font-size="11">3</text>
<text x="395.33" y="360.00" text-anchor="middle" font-size="11">4</text>
