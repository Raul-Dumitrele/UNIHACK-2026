<g id="COTE" stroke="#000" stroke-width="1">
<line x1="64.0" y1="658.0" x2="436.26" y2="658.0"/>
<line x1="64.0" y1="653.0" x2="64.0" y2="663.0"/>
<line x1="436.26" y1="653.0" x2="436.26" y2="663.0"/>
<line x1="38" y1="636.0" x2="38" y2="76.0"/>
<line x1="33" y1="636.0" x2="43" y2="636.0"/>
<line x1="33" y1="76.0" x2="43" y2="76.0"/>
</g>
<text x="250.13" y="676.0" text-anchor="middle">32,5 m</text>
<text x="30" y="356.0" text-anchor="middle" transform="rotate(-90 30 356.0)">48,89 m</text>
<text x="64" y="692.0" font-weight="bold">Legendă</text>
<text x="64" y="708.0">1. alee de acces (30,5 × 1,5 m)</text>
<text x="64" y="724.0">2. teren multisport (15 × 30 m)</text>
<text x="64" y="740.0">3. bancă 1 (1,8 × 0,6 m)</text>
<text x="64" y="756.0">4. bancă 2 (1,8 × 0,6 m)</text>
<text x="64" y="772.0">5. bancă 3 (1,8 × 0,6 m)</text>
<text x="64" y="788.0">6. coș de gunoi 1 (0,6 × 0,6 m)</text>
<text x="64" y="804.0">7. coș de gunoi 2 (0,6 × 0,6 m)</text>
<text x="64" y="836.0" font-size="11" fill="#555">Forma reală a terenului nu e cunoscută: planul folosește un dreptunghi de 32,5 × 48,89 m cu aceeași</text>
<text x="64" y="852.0" font-size="11" fill="#555">suprafață.</text>
<text x="64" y="868.0" font-size="11" fill="#555">Dimensiunile elementelor și zonele libere din jurul lor sunt ipoteze schematice ale aplicației, nu</text>
<text x="64" y="884.0" font-size="11" fill="#555">valori din standarde sau din fișe de produs.</text>
<text x="64" y="900.0" font-size="11" fill="#555">Pe contur rămâne o margine liberă de 1 m (împrejmuire, vegetație).</text>
<text x="64" y="916.0" font-size="11" fill="#555">Intrarea e pe latura de jos, cu o alee de 1,5 m.</text>
<text x="64" y="932.0" font-size="11" fill="#555">Plan schematic orientativ, generat automat. Nu este un proiect tehnic: dimensiunile sunt ipoteze de</text>
<text x="64" y="948.0" font-size="11" fill="#555">lucru, iar amplasarea reală o stabilește un proiectant autorizat, după măsurători pe teren.</text>
</svg>
