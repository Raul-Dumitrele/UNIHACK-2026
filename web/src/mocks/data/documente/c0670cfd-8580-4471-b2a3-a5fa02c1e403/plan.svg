<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Amenajare: teren de sport – Teren viran, Dorobanților (candidat OSM)</title>
<rect width="720" height="980" fill="#ffffff"/>
<text x="64" y="28" font-size="18" font-weight="bold">Amenajare: teren de sport – Teren viran, Dorobanților (candidat OSM)</text>
<text x="64" y="48" fill="#555">teren de sport · teren de 1589 mp (32,5 × 48,89 m) · plan schematic</text>
