<g id="TEXT">
<text x="250.13" y="619.95" text-anchor="middle" font-size="11">1</text>
<text x="172.82" y="428.09" text-anchor="middle" font-size="11">2</text>
<text x="286.21" y="602.20" text-anchor="middle" font-size="8">3</text>
<text x="318.29" y="602.20" text-anchor="middle" font-size="8">4</text>
<text x="350.36" y="602.20" text-anchor="middle" font-size="8">5</text>
<text x="373.27" y="604.50" text-anchor="middle" font-size="8">6</text>
<text x="387.01" y="604.50" text-anchor="middle" font-size="8">7</text>
